name: Update Streak Stat Image

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download updated streak card
        run: |
          curl -s "https://streak-stats.demolab.com?user=gidelmarjr-art&theme=tokyonight&hide_border=true&background=0D1117&timezone=America/Sao_Paulo" -o streak.svg

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add streak.svg
          git commit -m "docs: update streak stats" || echo "No changes to commit"
          git push
